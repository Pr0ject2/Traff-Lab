name: Apply final pre-release production fixes

on:
  push:
    branches:
      - fix/yandex-low-value-pages-20260909
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yandex-low-value-pages-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production fixes
        run: node scripts/apply-final-pre-release-fixes.mjs
      - name: Static validation
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/content/articles.json','utf8')); console.log('articles.json OK')"
          git diff --check
          ! grep -Rqi 'ProfitAds' public --include='*.html'
          grep -q 'YeezyPay' public/services/index.html
          grep -q 'Libermall Card' public/services/index.html
          grep -q 'YeezyPay' public/guides/paid-traffic/index.html
          grep -q 'Libermall Card' public/traffic/sources/paid/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const refs={'multilogin.com':'https://multilogin.com?a_aid=Affiliate_Lab','gologin.com':'https://gologin.com/join/TrafficLab-IQKLOHF','adspower-ru.com':'https://www.adspower-ru.com/share/YyE22MlGFTGU5sX','proxyline.net':'https://proxyline.net?line=287684','proxy6.net':'https://proxy6.net/c/644669','proxy-solutions.net':'https://proxy-solutions.net/?rc=mLToyhpFmc','proxys.io':'https://proxys.io/?refid=432979','onlinesim.io':'https://onlinesim.io/?bref=4472420','grizzlysms.com':'https://grizzlysms.com/ru/?r=1811078','sms-man.com':'https://sms-man.com/ru?ref=AETjb6uYtb1z','accsmarket.com':'https://accsmarket.com/ru/mPnZBvxv','dark.shopping':'https://dark.shopping/?p=211598','spy.house':'https://spy.house?partner=FWLUV4PA','partner.adsbridge.com':'https://partner.adsbridge.com/registration?hash=a5c1a89826c57dc7','ruvds.com':'https://ruvds.com/pr105265','aeza.net':'https://aeza.net/?ref=917380','cp.binom.org':'https://cp.binom.org/aff/go/megafon'};
          const files=[];const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&e.name.endsWith('.html'))files.push(p)}};walk('public');const bad=[];
          const hostKey=s=>{let u;try{u=new URL(s)}catch{return null}const host=u.hostname.replace(/^www\./,'');return Object.keys(refs).find(h=>host===h||host.endsWith('.'+h))||null};
          for(const f of files){const h=fs.readFileSync(f,'utf8');for(const m of h.matchAll(/<a\b[^>]*\bhref=["'](https?:\/\/[^"']+)["'][^>]*>/gi)){const key=hostKey(m[1]);if(key&&m[1]!==refs[key])bad.push(`${f}: href ${m[1]}`)}for(const m of h.matchAll(/\bdata-card-link=["']([^"']+)["']/gi)){const key=hostKey(m[1]);if(key&&m[1]!==refs[key])bad.push(`${f}: data-card-link ${m[1]}`)}}
          console.log(`Affiliate href/data-card-link issues: ${bad.length}`);if(bad.length){console.error(bad.join('\n'));process.exit(1)}
          NODE
      - name: Audit internal HTML links and anchors
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const root='public',files=[];const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&e.name.endsWith('.html'))files.push(p)}};walk(root);
          const toUrl=f=>{let r=f.slice(root.length).replace(/\\/g,'/');if(r==='/index.html')return '/';if(r.endsWith('/index.html'))return r.slice(0,-10);return r};const by=new Map(files.map(f=>[toUrl(f),f]));const resolve=u=>by.get(u)||by.get(u.endsWith('/')?u.slice(0,-1):u+'/')||null;const broken=[];
          for(const f of files){const html=fs.readFileSync(f,'utf8'),src=toUrl(f);for(const m of html.matchAll(/<a\b[^>]*\bhref=["']([^"']+)["'][^>]*>/gi)){const href=m[1].trim();if(!href||/^(?:https?:|mailto:|tel:|javascript:)/i.test(href)||href.startsWith('/assets/')||href.startsWith('/favicon')||href.startsWith('/go/')||href.startsWith('?'))continue;let pathname,hash='';if(href.startsWith('#')){pathname=src;hash=href.slice(1)}else if(href.startsWith('/')){const parts=href.split('#');pathname=parts[0].split('?')[0]||'/';hash=parts[1]||''}else continue;const target=resolve(pathname);if(!target){broken.push(`${src} -> ${href} missing page`);continue}if(hash){let h=hash;try{h=decodeURIComponent(h)}catch{}const th=target===f?html:fs.readFileSync(target,'utf8');const esc=h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(!new RegExp(`(?:id|name)=["']${esc}["']`,'i').test(th))broken.push(`${src} -> ${href} missing anchor`)}}}
          console.log(`HTML pages scanned: ${files.length}`);console.log(`Broken internal links/anchors: ${broken.length}`);if(broken.length){console.error(broken.join('\n'));process.exit(1)}
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --directory public >/tmp/trafficlab-final-fix.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/services/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/trafficlab-final-fix.log; exit 1
      - name: Verify changed pages and 320px admin
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});const failures=[];
          const specs=['/services/','/guides/paid-traffic/','/traffic/sources/paid/','/guides/cpa-vs-revshare/'];
          for(const vp of [{name:'320',width:320,height:760},{name:'390',width:390,height:844},{name:'1440',width:1440,height:900}]){const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height}});for(const p of specs){const page=await ctx.newPage();const errs=[];page.on('pageerror',e=>errs.push(String(e)));await page.goto('http://127.0.0.1:4173'+p,{waitUntil:'networkidle'});const info=await page.evaluate(()=>({h1:document.querySelectorAll('h1').length,canonical:document.querySelectorAll('link[rel="canonical"]').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,profit:document.body.innerText.includes('ProfitAds'),yeezy:document.body.innerText.includes('YeezyPay')}));if(errs.length||info.h1!==1||info.canonical!==1||info.overflow||info.profit||(!info.yeezy&&p!=='/guides/cpa-vs-revshare/'))failures.push(`${vp.name} ${p}: ${JSON.stringify(info)} ${errs.join('; ')}`);await page.close()}await ctx.close()}
          const ctx=await browser.newContext({viewport:{width:320,height:760}});const admin=await ctx.newPage();await admin.goto('http://127.0.0.1:4173/admin/',{waitUntil:'networkidle'});const adminInfo=await admin.evaluate(()=>({docWidth:document.documentElement.scrollWidth,vw:document.documentElement.clientWidth,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,headerRight:Math.round(document.querySelector('.adm-top')?.getBoundingClientRect().right||0),actionsRight:Math.round(document.querySelector('.adm-top-actions')?.getBoundingClientRect().right||0)}));console.log('Admin 320',adminInfo);if(adminInfo.overflow)failures.push(`admin 320 overflow: ${JSON.stringify(adminInfo)}`);await ctx.close();await browser.close();if(failures.length){console.error(failures.join('\n'));process.exit(1)}console.log('Final changed-page rendering OK');
          NODE
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then echo "No production changes"; else git commit -m "Replace ad payment service and fix final mobile issues"; git push origin HEAD:fix/yandex-low-value-pages-20260909; fi
