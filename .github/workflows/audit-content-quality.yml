name: Audit content quality

on:
  push:
    branches:
      - fix/yandex-low-value-pages-20260909
    paths:
      - .github/workflows/audit-content-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static content audit
        run: node scripts/audit-content-quality.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: content-quality-audit
          path: audit-output/
          if-no-files-found: error
