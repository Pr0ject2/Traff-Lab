name: Apply preventive content quality batch

on:
  push:
    branches:
      - fix/yandex-low-value-pages-20260909
    paths:
      - .github/workflows/apply-quality-batch-2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply quality batch
        run: node scripts/improve-quality-batch-2.mjs

      - name: Static validation and audit
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/content/articles.json','utf8')); console.log('articles.json OK')"
          node scripts/audit-content-quality.mjs
          git diff --check
          for id in ftd-reconciliation organic-cost worked-metrics reconcile-base manager-brief; do
            test "$(grep -Rho "id=\"$id\"" public/guides | wc -l)" -eq 1 || { echo "Bad count for $id"; exit 1; }
          done

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --directory public >/tmp/trafficlab-quality.log 2>&1 &
          echo $! >/tmp/trafficlab-quality.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/guides/ftd/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/trafficlab-quality.log
          exit 1

      - name: Verify desktop and mobile rendering
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const pages = {
            '/guides/ftd/': ['ftd-reconciliation','ftd-check'],
            '/guides/free-traffic/': ['organic-cost','organic-decision'],
            '/guides/metrics/': ['worked-metrics','compare-metrics'],
            '/guides/ggr-ngr/': ['reconcile-base','same-rate'],
            '/guides/affiliate-manager/': ['manager-brief','manager-question']
          };
          const browser = await chromium.launch({headless:true});
          const failures=[];
          for (const viewport of [{name:'desktop',width:1440,height:900},{name:'mobile',width:390,height:844}]) {
            const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});
            for (const [path, ids] of Object.entries(pages)) {
              const page=await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
              const info=await page.evaluate(ids=>({
                h1:document.querySelectorAll('h1').length,
                canonical:document.querySelectorAll('link[rel="canonical"]').length,
                overflow:document.body.scrollWidth>document.documentElement.clientWidth+2,
                ids:Object.fromEntries(ids.map(id=>[id,document.querySelectorAll('#'+CSS.escape(id)).length]))
              }),ids);
              if(errors.length) failures.push(`${viewport.name} ${path}: JS ${errors.join('; ')}`);
              if(info.h1!==1||info.canonical!==1) failures.push(`${viewport.name} ${path}: h1/canonical`);
              if(info.overflow) failures.push(`${viewport.name} ${path}: overflow`);
              for(const id of ids) if(info.ids[id]!==1) failures.push(`${viewport.name} ${path}: ${id}=${info.ids[id]}`);
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('Rendered quality batch OK');
          NODE

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "Strengthen thin guides and sync reading metadata"
            git push origin HEAD:${{ github.ref_name }}
          fi
