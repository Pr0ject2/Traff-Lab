name: Finish Yandex page quality fixes

on:
  push:
    branches:
      - fix/yandex-low-value-pages-20260909
    paths:
      - .github/workflows/finish-yandex-page-quality.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Match current YouTube article class in temporary patcher
        shell: bash
        run: |
          python3 - <<'PY'
          p = 'scripts/finish-yandex-page-quality.mjs'
          s = open(p, encoding='utf-8').read()
          marker = '// YouTube: add opt-out and long-video-specific interpretation.'
          head, tail = s.split(marker, 1)
          old = '<article class="article source-playbook-article"'
          new = '<article class="article source-playbook-article guide-structured-v101"'
          if tail.count(old) < 2:
              raise SystemExit('YouTube patch markers not found')
          tail = tail.replace(old, new, 2)
          open(p, 'w', encoding='utf-8').write(head + marker + tail)
          PY

      - name: Apply focused content and runtime fixes
        run: node scripts/finish-yandex-page-quality.mjs

      - name: Validate production changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node -e "JSON.parse(require('fs').readFileSync('public/content/articles.json','utf8')); console.log('articles.json OK')"
          grep -q 'data-preserve-source-copy="true"' public/traffic/sources/paid/index.html
          grep -q 'data-preserve-source-copy="true"' public/traffic/sources/youtube/index.html
          grep -q 'id="paid-reconciliation"' public/traffic/sources/paid/index.html
          grep -q 'id="youtube-studio-reading"' public/traffic/sources/youtube/index.html
          grep -q 'data-adsbridge-click-chain' public/guides/adsbridge-campaign/index.html
          grep -q 'RS и CPA: какие условия выписать из своего оффера' public/guides/partner-program-rules/index.html
          ! grep -q 'Базовая ставка на старте — 50% GGR' public/guides/partner-program-rules/index.html
          ! grep -q '10 депозиторов + \$70' public/guides/partner-program-rules/index.html
          ! grep -q 'Выплаты — еженедельно по вторникам' public/guides/partner-program-rules/index.html
          ! grep -q 'до двух месяцев' public/guides/partner-program-rules/index.html
          grep -q "preserveSourceCopy=article.dataset.preserveSourceCopy==='true'" public/assets/app.js
          grep -q "!structuredV101&&!preserveSourceCopy&&tracking&&metrics" public/assets/app.js

      - name: Commit production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/app.js public/guides/adsbridge-campaign/index.html public/guides/partner-program-rules/index.html public/traffic/sources/paid/index.html public/traffic/sources/youtube/index.html
          if git diff --cached --quiet; then
            echo 'No production changes to commit'
            exit 0
          fi
          git commit -m "Preserve source-page intent and deepen Yandex fixes"
          git push origin HEAD:${{ github.ref_name }}
