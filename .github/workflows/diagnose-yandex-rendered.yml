name: Verify rendered Yandex pages

on:
  push:
    branches:
      - fix/yandex-low-value-pages-20260909
    paths:
      - .github/workflows/diagnose-yandex-rendered.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 -d public >/tmp/trafficlab-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Verify rendered desktop and mobile pages
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const expected = {
            '/guides/adsbridge-campaign/': 'AdsBridge: первая кампания от клика до тестовой конверсии',
            '/guides/partner-program-rules/': 'Правила партнёрской программы: что проверить до запуска трафика',
            '/traffic/sources/paid/': 'Платный трафик как источник: запуск, диагностика и масштабирование',
            '/traffic/sources/youtube/': 'YouTube как источник трафика: канал, длинные видео и первый тест'
          };
          const viewports = [
            {name:'desktop', width:1440, height:900},
            {name:'mobile', width:390, height:844}
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const failures=[];
            for (const vp of viewports) {
              const context = await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              for (const [path, expectedH1] of Object.entries(expected)) {
                const page = await context.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
                const info = await page.evaluate(()=>{
                  const text=document.querySelector('main')?.innerText||'';
                  const bodyWidth=document.body.scrollWidth;
                  const viewportWidth=document.documentElement.clientWidth;
                  return {
                    h1:document.querySelector('h1')?.textContent?.trim()||'',
                    lead:document.querySelector('p.lead')?.textContent?.trim()||'',
                    horizontalOverflow:bodyWidth>viewportWidth+2,
                    h1Count:document.querySelectorAll('h1').length,
                    canonicalCount:document.querySelectorAll('link[rel="canonical"]').length,
                    ctrDescription:/CTR\s+в\s+описани/i.test(text),
                    paidReconciliation:document.querySelectorAll('#paid-reconciliation').length,
                    youtubeReading:document.querySelectorAll('#youtube-studio-reading').length,
                    adsChain:document.querySelectorAll('[data-adsbridge-click-chain]').length,
                    rulesAudit:document.querySelectorAll('#rules-audit').length,
                    stalePartnerRate:/50%\s*GGR|10\s+депозиторов\s*\+\s*\$70|по\s+вторникам/i.test(text)
                  };
                });
                console.log(JSON.stringify({viewport:vp.name,path,errors,info}));
                if (errors.length) failures.push(`${vp.name} ${path}: JS errors`);
                if (info.h1!==expectedH1) failures.push(`${vp.name} ${path}: H1 mismatch: ${info.h1}`);
                if (info.horizontalOverflow) failures.push(`${vp.name} ${path}: horizontal overflow`);
                if (info.h1Count!==1 || info.canonicalCount!==1) failures.push(`${vp.name} ${path}: H1/canonical count`);
                if (path==='/traffic/sources/paid/' && (info.ctrDescription || info.paidReconciliation!==1)) failures.push(`${vp.name} paid: generic metric override remained or reconciliation missing`);
                if (path==='/traffic/sources/youtube/' && info.youtubeReading!==1) failures.push(`${vp.name} youtube: Studio interpretation missing`);
                if (path==='/guides/adsbridge-campaign/' && info.adsChain!==1) failures.push(`${vp.name} adsbridge: click chain missing`);
                if (path==='/guides/partner-program-rules/' && (info.rulesAudit!==1 || info.stalePartnerRate)) failures.push(`${vp.name} partner rules: audit missing or stale promotional numbers remained`);
                await page.close();
              }
              await context.close();
            }
            await browser.close();
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
          })();
          NODE
