name: Audit Russian language

on:
  push:
    branches:
      - fix/yandex-low-value-pages-20260909
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yandex-low-value-pages-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LanguageTool wrapper
        run: pip install language-tool-python==2.9.4
      - name: Run Russian editorial audit
        run: python scripts/audit-russian-language.py
