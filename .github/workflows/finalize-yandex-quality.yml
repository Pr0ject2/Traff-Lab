name: Finalize Yandex page quality cleanup

on:
  push:
    branches:
      - fix/yandex-low-value-pages-20260909
    paths:
      - .github/workflows/finalize-yandex-quality.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final content consistency fixes
        run: node scripts/finalize-yandex-quality.mjs

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node -e "JSON.parse(require('fs').readFileSync('public/content/articles.json','utf8')); console.log('articles.json OK')"
          grep -q 'AdsBridge: первая кампания от клика до тестовой конверсии"' public/assets/app.js
          ! grep -q 'тестовой конверсии и проверить трекинг' public/assets/app.js
          grep -q 'YouTube как источник трафика: канал, длинные видео и первый тест' public/assets/app.js
          grep -q 'id="geo-verification"' public/guides/partner-program-rules/index.html
          ! grep -q 'id="geo-program"' public/guides/partner-program-rules/index.html
          ! grep -q 'security.partners@1w.run' public/guides/partner-program-rules/index.html
          ! grep -q 'до 14 дней' public/guides/partner-program-rules/index.html
          ! grep -q 'Республики Сейшелы' public/guides/partner-program-rules/index.html
          ! grep -q 'Актуально на 19.08.2026' public/guides/partner-program-rules/index.html

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 -d public >/tmp/trafficlab-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done

      - name: Verify desktop and mobile rendering
        run: node scripts/verify-yandex-pages.mjs

      - name: Commit final production cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/app.js public/guides/partner-program-rules/index.html
          git commit -m "Remove stale partner snapshot and sync runtime metadata"
          git push origin HEAD:${{ github.ref_name }}
