          def set_meta(text, key, value, content):
              pattern = re.compile(r'<meta\\b[^>]*\\b' + re.escape(key) + r'=["\\\']' + re.escape(value) + r'["\\\'][^>]*>', re.I)
              def repl(m):
                  tag = m.group(0)
                  escaped = html.escape(content, quote=True)
                  if re.search(r'\\bcontent=["\\\']', tag, re.I):
                      return re.sub(r'\\bcontent=(["\\\']).*?\\1', 'content="' + escaped + '"', tag, count=1, flags=re.I)
                  close = '/>' if tag.endswith('/>') else '>'
                  base = tag[:-2] if close == '/>' else tag[:-1]
                  return base + ' content="' + escaped + '"' + close
              new, n = pattern.subn(repl, text, count=1)
              if n != 1:
                  raise RuntimeError(f"meta {key}={value}: expected 1, got {n}")
              return new

          def update_jsonld(text, title, desc):
              pat = re.compile(r'<script type="application/ld\\+json">(.*?)</script>', re.S)
              m = pat.search(text)
              if not m:
                  raise RuntimeError("JSON-LD block not found")
              data = json.loads(m.group(1))
              graph = data.get("@graph", [])
              for node in graph:
                  t = node.get("@type")
                  if t == "WebPage":
                      node["name"] = title
                      node["description"] = desc
                  elif t == "Article":
                      node["headline"] = title
                      if "name" in node:
                          node["name"] = title
                      node["description"] = desc
                      node["dateModified"] = DATE_ISO
                  elif t == "BreadcrumbList":
                      items = node.get("itemListElement") or []
                      if items:
                          items[-1]["name"] = title
              packed = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
              return text[:m.start(1)] + packed + text[m.end(1):]

          def purpose_block(label, body):
              return f'<div class="inline-note article-purpose-note"><b>{label}</b><p>{body}</p></div>'

          def edit_page(cfg):
              p = Path(cfg["path"])
              text = p.read_text(encoding="utf-8")
              title = cfg["title"]
              desc = cfg["desc"]
              lead = cfg["lead"]

              text, n = re.subn(r'<title>.*?</title>', '<title>' + html.escape(title) + ' | TrafficLab</title>', text, count=1, flags=re.S)
              if n != 1: raise RuntimeError(f"{p}: title")
              text = set_meta(text, "name", "description", desc)
              text = set_meta(text, "property", "og:title", title)
              text = set_meta(text, "property", "og:description", desc)
              text = set_meta(text, "name", "twitter:title", title)
              text = set_meta(text, "name", "twitter:description", desc)
              text = set_meta(text, "property", "article:modified_time", DATE_ISO)
              text = update_jsonld(text, title, desc)

              text, n = re.subn(r'<h1>.*?</h1>', '<h1>' + html.escape(title) + '</h1>', text, count=1, flags=re.S)
              if n != 1: raise RuntimeError(f"{p}: h1")
              text, n = re.subn(r'<p class="lead">.*?</p>', '<p class="lead">' + html.escape(lead) + '</p>', text, count=1, flags=re.S)
              if n != 1: raise RuntimeError(f"{p}: lead")

              block = purpose_block(cfg["note_label"], cfg["note"])
              if 'class="inline-note article-purpose-note"' in text:
                  text, n = re.subn(r'<div class="inline-note article-purpose-note">.*?</div>', block, text, count=1, flags=re.S)
                  if n != 1: raise RuntimeError(f"{p}: purpose replace")
              elif '<!-- TL-CMS:ARTICLE_BODY_START -->' in text:
                  text = text.replace('<!-- TL-CMS:ARTICLE_BODY_START -->', '<!-- TL-CMS:ARTICLE_BODY_START -->\n' + block, 1)
              else:
                  pat = re.compile(r'(<header class="academy-article-hero".*?</header>)', re.S)
                  text, n = pat.subn(r'\\1\n' + block, text, count=1)
                  if n != 1: raise RuntimeError(f"{p}: hero insert")

              text = re.sub(r'(class="article-label">[^<]*обновлено )\\d{2}\\.\\d{2}\\.\\d{4}', r'\\g<1>' + DATE_RU, text, count=1, flags=re.I)
              p.write_text(text, encoding="utf-8")

              # Structural checks
              check = p.read_text(encoding="utf-8")
              if check.count('<h1>') != 1:
                  raise RuntimeError(f"{p}: h1 count {check.count('<h1>')}")
              if title not in check or desc not in check or DATE_ISO not in check:
                  raise RuntimeError(f"{p}: expected SEO fields missing")
              jm = re.search(r'<script type="application/ld\\+json">(.*?)</script>', check, re.S)
              json.loads(jm.group(1))

          for url, cfg in pages.items():
              edit_page(cfg)

          # Keep the public library index synchronized for any matching entries.
          articles_path = Path("public/content/articles.json")
          data = json.loads(articles_path.read_text(encoding="utf-8"))
          by_url = {a.get("url"): a for a in data.get("articles", [])}
          for url, cfg in pages.items():
              a = by_url.get(url)
              if not a:
                  continue
              a["title"] = cfg["title"]
              a["description"] = cfg["desc"]
              a["lead"] = cfg["lead"]
              a["date"] = DATE_RU
          articles_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Update sitemap lastmod only for pages actually changed.
          sitemap_path = Path("public/sitemap.xml")
          sitemap = sitemap_path.read_text(encoding="utf-8")
          for url in pages:
              loc = "https://traff-lab.com" + url
              pat = re.compile(r'(<url><loc>' + re.escape(loc) + r'</loc><lastmod>)\\d{4}-\\d{2}-\\d{2}(</lastmod></url>)')
              sitemap, n = pat.subn(r'\\g<1>' + DATE_ISO + r'\\2', sitemap, count=1)
              if n != 1:
                  raise RuntimeError(f"sitemap entry not found: {url}")
          sitemap_path.write_text(sitemap, encoding="utf-8")

          print("Updated", len(pages), "pages")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guides public/services public/content/articles.json public/sitemap.xml
          git diff --cached --check
          git commit -m "SEO: sharpen low-demand page intents [skip ci]"
          git push origin HEAD:seo-low-demand-wave1-20260928
