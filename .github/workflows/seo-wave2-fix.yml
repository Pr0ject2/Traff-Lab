name: Patch SEO wave 2

on:
  push:
    branches:
      - seo-low-demand-wave2-20260928

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-low-demand-wave2-20260928
          fetch-depth: 0
      - name: Patch compare-page intro handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/seo-wave2.yml')
          text = p.read_text(encoding='utf-8')
          if 'compare lead insert point' in text:
              raise SystemExit(0)
          lines = text.splitlines()

          lead_i = next((i for i, line in enumerate(lines) if "text, n = re.subn(r'<p class=\"lead\">.*?</p>'" in line), None)
          if lead_i is None:
              raise SystemExit('Lead updater line not found')
          indent = lines[lead_i][:len(lines[lead_i]) - len(lines[lead_i].lstrip())]
          if lead_i + 1 >= len(lines) or 'if n != 1: raise RuntimeError' not in lines[lead_i + 1]:
              raise SystemExit('Lead guard line not found')
          lines[lead_i + 1:lead_i + 1] = [
              indent + 'if n != 1 and cfg["path"] == "public/traffic/compare/index.html":',
              indent + '    text, n = re.subn(r\'(</h1>)<p>.*?</p>\', lambda m: m.group(1) + \'<p class="lead">\' + html.escape(lead) + \'</p>\', text, count=1, flags=re.S)',
          ]

          body_i = next((i for i, line in enumerate(lines) if "elif '<!-- TL-CMS:ARTICLE_BODY_START -->' in text:" in line), None)
          if body_i is None:
              raise SystemExit('CMS body branch not found')
          else_i = next((i for i in range(body_i + 1, min(body_i + 8, len(lines))) if lines[i].strip() == 'else:'), None)
          if else_i is None:
              raise SystemExit('Fallback insert branch not found')
          bindent = lines[else_i][:len(lines[else_i]) - len(lines[else_i].lstrip())]
          lines[else_i:else_i] = [
              bindent + 'elif cfg["path"] == "public/traffic/compare/index.html":',
              bindent + '    needle = \'<p class="lead">\' + html.escape(lead) + \'</p>\'',
              bindent + '    if needle not in text:',
              bindent + '        raise RuntimeError(f"{p}: compare lead insert point")',
              bindent + '    text = text.replace(needle, needle + block, 1)',
          ]

          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          if git diff --quiet -- .github/workflows/seo-wave2.yml; then
            echo 'Already patched; nothing to push.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/seo-wave2.yml
          git commit -m "Fix SEO wave 2 compare-page updater"
          git push origin HEAD:seo-low-demand-wave2-20260928
