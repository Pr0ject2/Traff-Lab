name: Hotfix partner CTA contrast

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-partner-cta.mjs

jobs:
  fix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply CTA contrast fix
        run: node scripts/fix-partner-cta.mjs
      - name: Validate
        run: |
          git diff --check
          grep -q 'tl-partner-cta-contrast-v526' public/guides/partner-program-rules/index.html
          grep -q 'background:#2d735f!important' public/guides/partner-program-rules/index.html
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guides/partner-program-rules/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix partner CTA contrast"
            git push origin HEAD:main
          fi
