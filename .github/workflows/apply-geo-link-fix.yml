name: Apply GEO depth and link repair

on:
  push:
    branches:
      - fix/yandex-low-value-pages-20260909
    paths:
      - .github/workflows/apply-geo-link-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply GEO repair
        run: node scripts/fix-geo-links-and-depth.mjs

      - name: Validate static content and all internal links
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/content/articles.json','utf8')); console.log('articles.json OK')"
          git diff --check
          node scripts/audit-internal-links.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --directory public >/tmp/trafficlab-geo.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/guides/geo/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/trafficlab-geo.log
          exit 1

      - name: Verify GEO pages desktop and mobile
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const specs={
            '/guides/geo/':['geo-checklist','geo-split'],
            '/guides/nigeria-ad-guidelines/':['before','checklist']
          };
          const browser=await chromium.launch({headless:true});
          const failures=[];
          for(const vp of [{name:'desktop',width:1440,height:900},{name:'mobile',width:390,height:844}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            for(const [path,ids] of Object.entries(specs)){
              const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
              const info=await page.evaluate(ids=>({h1:document.querySelectorAll('h1').length,canonical:document.querySelectorAll('link[rel="canonical"]').length,overflow:document.body.scrollWidth>document.documentElement.clientWidth+2,ids:Object.fromEntries(ids.map(id=>[id,document.querySelectorAll('#'+CSS.escape(id)).length])),stale:[...document.querySelectorAll('a')].filter(a=>a.getAttribute('href')?.includes('/partner-program-rules/#africa')||a.getAttribute('href')?.includes('/partner-program-rules/#geos')).length}),ids);
              if(errors.length)failures.push(`${vp.name} ${path}: ${errors.join('; ')}`);
              if(info.h1!==1||info.canonical!==1||info.overflow||info.stale)failures.push(`${vp.name} ${path}: structure ${JSON.stringify(info)}`);
              for(const id of ids)if(info.ids[id]!==1)failures.push(`${vp.name} ${path}: ${id}=${info.ids[id]}`);
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('GEO render verification OK');
          NODE

      - name: Commit production repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "Repair GEO links and strengthen country checks"
            git push origin HEAD:${{ github.ref_name }}
          fi
