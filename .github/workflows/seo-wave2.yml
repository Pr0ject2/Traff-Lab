          def set_meta(text, key, value, content, required=True):
              tags = list(re.finditer(r'<meta[^>]*>', text, flags=re.I))
              hits = []
              for m in tags:
                  tag = m.group(0)
                  if f'{key}="{value}"' in tag or f"{key}='{value}'" in tag:
                      hits.append(m)
              if not hits:
                  if required:
                      raise RuntimeError(f"missing meta {key}={value}")
                  return text
              if len(hits) != 1:
                  raise RuntimeError(f"duplicate meta {key}={value}: {len(hits)}")
              m = hits[0]
              tag = m.group(0)
              escaped = html.escape(content, quote=True)
              if re.search(r'content=["\']', tag, flags=re.I):
                  tag2 = re.sub(r'content=(["\']).*?\1', 'content="' + escaped + '"', tag, count=1, flags=re.I)
              else:
                  close = '/>' if tag.endswith('/>') else '>'
                  base = tag[:-2] if close == '/>' else tag[:-1]
                  tag2 = base + ' content="' + escaped + '"' + close
              return text[:m.start()] + tag2 + text[m.end():]

          def update_jsonld(text, title, desc):
              pat = re.compile(r'<script type="application/ld[+]json">(.*?)</script>', re.S)
              m = pat.search(text)
              if not m:
                  return text
              data = json.loads(m.group(1))
              for node in data.get("@graph", []):
                  kind = node.get("@type")
                  if kind == "WebPage":
                      node["name"] = title
                      node["description"] = desc
                  elif kind == "Article":
                      node["headline"] = title
                      if "name" in node:
                          node["name"] = title
                      node["description"] = desc
                      node["dateModified"] = DATE_ISO
                  elif kind == "BreadcrumbList":
                      items = node.get("itemListElement") or []
                      if items:
                          items[-1]["name"] = title
              packed = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
              return text[:m.start(1)] + packed + text[m.end(1):]

          def purpose_block(cfg):
              return '<div class="inline-note article-purpose-note"><b>' + cfg["label"] + '</b><p>' + cfg["note"] + '</p></div>'

          def edit_page(cfg):
              p = Path(cfg["path"])
              text = p.read_text(encoding="utf-8")
              title, desc, lead = cfg["title"], cfg["desc"], cfg["lead"]
              text, n = re.subn(r'<title>.*?</title>', '<title>' + html.escape(title) + ' | TrafficLab</title>', text, count=1, flags=re.S)
              if n != 1: raise RuntimeError(f"{p}: title")
              text = set_meta(text, "name", "description", desc)
              text = set_meta(text, "property", "og:title", title)
              text = set_meta(text, "property", "og:description", desc)
              text = set_meta(text, "name", "twitter:title", title)
              text = set_meta(text, "name", "twitter:description", desc)
              text = set_meta(text, "property", "article:modified_time", DATE_ISO, required=False)
              text = update_jsonld(text, title, desc)
              text, n = re.subn(r'<h1>.*?</h1>', '<h1>' + html.escape(title) + '</h1>', text, count=1, flags=re.S)
              if n != 1: raise RuntimeError(f"{p}: h1")
              text, n = re.subn(r'<p class="lead">.*?</p>', '<p class="lead">' + html.escape(lead) + '</p>', text, count=1, flags=re.S)
              if n != 1: raise RuntimeError(f"{p}: lead")
              block = purpose_block(cfg)
              if 'class="inline-note article-purpose-note"' in text:
                  text, n = re.subn(r'<div class="inline-note article-purpose-note">.*?</div>', block, text, count=1, flags=re.S)
                  if n != 1: raise RuntimeError(f"{p}: purpose")
              elif '<!-- TL-CMS:ARTICLE_BODY_START -->' in text:
                  text = text.replace('<!-- TL-CMS:ARTICLE_BODY_START -->', '<!-- TL-CMS:ARTICLE_BODY_START -->\n' + block, 1)
              else:
                  text, n = re.subn(r'(</header>)', r'\1\n' + block, text, count=1)
                  if n != 1: raise RuntimeError(f"{p}: insert")
              text = re.sub(r'(обновлено )[0-9]{2}[.][0-9]{2}[.][0-9]{4}', lambda m: m.group(1) + DATE_RU, text, count=1, flags=re.I)
              p.write_text(text, encoding="utf-8")

          # 1. Sharpen target and remaining low-demand pages.
          for cfg in pages.values():
              edit_page(cfg)

          # 2. Remove duplicate guide cards before replacing links globally.
          for p in Path("public").rglob("*.html"):
              text = p.read_text(encoding="utf-8")
              original = text
              for old in redirects:
                  pat = re.compile(r'<article class="library-row"(?=[^>]*data-card-link="' + re.escape(old) + r'")[\s\S]*?</article>')
                  text = pat.sub('', text)
              if text != original:
                  p.write_text(text, encoding="utf-8")

          # 3. Replace internal references to consolidated URLs across HTML.
          for p in Path("public").rglob("*.html"):
              text = p.read_text(encoding="utf-8")
              original = text
              for old, new in redirects.items():
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding="utf-8")

          # 4. Remove duplicate source files; Cloudflare redirects will own those URLs.
          for old in redirects:
              source = Path("public" + old + "index.html")
              if not source.exists():
                  raise RuntimeError(f"missing redirect source: {source}")
              source.unlink()

          # 5. Sync article catalog: remove consolidated entries and update edited entries.
          articles_path = Path("public/content/articles.json")
          data = json.loads(articles_path.read_text(encoding="utf-8"))
          articles = data.get("articles", [])
          articles = [a for a in articles if a.get("url") not in redirects]
          by_url = {a.get("url"): a for a in articles}
          for url, cfg in pages.items():
              a = by_url.get(url)
              if a:
                  a["title"] = cfg["title"]
                  a["description"] = cfg["desc"]
                  a["lead"] = cfg["lead"]
                  a["date"] = DATE_RU
          data["articles"] = articles
          urls = [a.get("url") for a in articles]
          if len(urls) != len(set(urls)):
              raise RuntimeError("duplicate article URLs after consolidation")
          articles_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # 6. Keep hardcoded library cards in sync for changed guide pages from both waves.
          guide_index = Path("public/guides/index.html")
          text = guide_index.read_text(encoding="utf-8")
          article_map = {a.get("url"): a for a in articles}
          sync_urls = first_wave_guides | {u for u in pages if u.startswith('/guides/')}
          for url in sync_urls:
              a = article_map.get(url)
              if not a:
                  continue
              pat = re.compile(r'(<article class="library-row"(?=[^>]*data-card-link="' + re.escape(url) + r'")[\s\S]*?<h2>)(.*?)(</h2>)')
              text, _ = pat.subn(lambda m, title=a.get("title", ""): m.group(1) + html.escape(title) + m.group(3), text, count=1)
          guide_index.write_text(text, encoding="utf-8")

          # 7. Sitemap: remove old URLs and update lastmod only for pages changed in this wave.
          sitemap_path = Path("public/sitemap.xml")
          sitemap = sitemap_path.read_text(encoding="utf-8")
          for old in redirects:
              loc = "https://traff-lab.com" + old
              sitemap, n = re.subn(r'<url><loc>' + re.escape(loc) + r'</loc><lastmod>[^<]+</lastmod></url>', '', sitemap, count=1)
              if n != 1:
                  raise RuntimeError(f"sitemap old URL not found: {old}")
          for url in pages:
              loc = "https://traff-lab.com" + url
              pat = re.compile(r'(<url><loc>' + re.escape(loc) + r'</loc><lastmod>)[^<]+(</lastmod></url>)')
              sitemap, n = pat.subn(r'\g<1>' + DATE_ISO + r'\2', sitemap, count=1)
              if n != 1:
                  raise RuntimeError(f"sitemap target not found: {url}")
          locs = re.findall(r'<loc>(.*?)</loc>', sitemap)
          if len(locs) != len(set(locs)):
              raise RuntimeError("duplicate sitemap URLs after consolidation")
          sitemap_path.write_text(sitemap, encoding="utf-8")

          # 8. Add permanent redirects, both slash variants.
          redirects_path = Path("public/_redirects")
          rtext = redirects_path.read_text(encoding="utf-8").rstrip() + "\n"
          for old, new in redirects.items():
              bare = old[:-1]
              for src in (bare, old):
                  rule = f"{src} {new} 301"
                  if rule not in rtext:
                      rtext += rule + "\n"
          redirects_path.write_text(rtext, encoding="utf-8")

          # 9. Validation.
          for url, cfg in pages.items():
              p = Path(cfg["path"])
              text = p.read_text(encoding="utf-8")
              if text.count('<h1>') != 1:
                  raise RuntimeError(f"{url}: expected one h1")
              if cfg["title"] not in text or cfg["desc"] not in text:
                  raise RuntimeError(f"{url}: SEO fields missing")
              m = re.search(r'<script type="application/ld[+]json">(.*?)</script>', text, re.S)
              if m:
                  json.loads(m.group(1))
          for old in redirects:
              if (Path("public" + old + "index.html")).exists():
                  raise RuntimeError(f"old file still exists: {old}")
              if old in sitemap_path.read_text(encoding="utf-8"):
                  raise RuntimeError(f"old URL still in sitemap: {old}")
              if any(a.get("url") == old for a in articles):
                  raise RuntimeError(f"old URL still in article catalog: {old}")
              for p in Path("public").rglob("*.html"):
                  if old in p.read_text(encoding="utf-8"):
                      raise RuntimeError(f"old URL still referenced in {p}: {old}")

          print("Updated", len(pages), "pages; consolidated", len(redirects), "duplicate guides")
